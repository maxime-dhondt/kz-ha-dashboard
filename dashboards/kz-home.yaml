title: KZ Home
views:
  - title: My Home
    path: home
    icon: mdi:home
    type: custom:grid-layout
    theme: Apple Glass
    background: center / cover no-repeat fixed url("/local/kz-ha-dashboard/background.jpg")
    layout:
      grid-template-columns: 64px repeat(11, minmax(0, 1fr))
      grid-template-areas: |
        "rail welcome welcome welcome welcome welcome welcome welcome welcome welcome welcome welcome"
        "rail rooms rooms rooms rooms rooms rooms rooms rooms rooms rooms rooms"
        "rail promo promo promo media media media media media camera camera camera"
        "rail climate climate climate climate light light light devices devices devices devices"
        "rail climate climate climate climate light light light devices devices devices devices"
        "rail energy energy energy energy energy speaker speaker speaker weather weather weather"
      grid-gap: 14px
      padding: 20px
      mediaquery:
        "(max-width: 1100px)":
          grid-template-columns: repeat(6, minmax(0, 1fr))
          grid-template-areas: |
            "welcome welcome welcome welcome welcome welcome"
            "rooms rooms rooms rooms rooms rooms"
            "promo promo promo media media media"
            "camera camera camera camera camera camera"
            "climate climate climate light light light"
            "devices devices devices devices devices devices"
            "energy energy energy energy energy energy"
            "speaker speaker speaker weather weather weather"
            "rail rail rail rail rail rail"
          grid-gap: 12px
          padding: 14px
        "(max-width: 700px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
          grid-template-areas: |
            "welcome welcome"
            "rooms rooms"
            "rail rail"
            "promo promo"
            "media media"
            "camera camera"
            "climate climate"
            "light light"
            "devices devices"
            "energy energy"
            "speaker speaker"
            "weather weather"
          grid-gap: 9px
          padding: 8px
    cards:
      # Floating navigation rail. At phone width it becomes a horizontal dock.
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: navigation
            icon: mdi:home-variant
            navigation_path: /kz-home/home
          - type: navigation
            icon: mdi:floor-plan
            navigation_path: /kz-home/rooms
          - type: navigation
            icon: mdi:play-box-multiple
            navigation_path: /kz-home/media
          - type: navigation
            icon: mdi:lightning-bolt
            navigation_path: /kz-home/energy
          - type: navigation
            icon: mdi:shield-home
            navigation_path: /kz-home/security
          - type: navigation
            icon: mdi:cog
            navigation_path: /config
        view_layout:
          grid-area: rail

      - type: custom:mushroom-title-card
        title: "Welcome home"
        subtitle: "Your home at a glance"
        view_layout:
          grid-area: welcome

      # Room selector
      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: template
            icon: mdi:home
            content: My Home
            tap_action:
              action: navigate
              navigation_path: /kz-home/home
          - type: template
            icon: mdi:sofa
            content: Living Room
            tap_action:
              action: navigate
              navigation_path: /kz-home/living-room
          - type: template
            icon: mdi:shower
            content: Bathroom
            tap_action:
              action: navigate
              navigation_path: /kz-home/bathroom
          - type: template
            icon: mdi:desk
            content: Office
            tap_action:
              action: navigate
              navigation_path: /kz-home/office
          - type: template
            icon: mdi:bed
            content: Bedroom
            tap_action:
              action: navigate
              navigation_path: /kz-home/bedroom
        view_layout:
          grid-area: rooms

      - type: custom:mushroom-template-card
        primary: Make your home yours
        secondary: All your devices, one beautiful place
        icon: mdi:home-heart
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /config/areas
        view_layout:
          grid-area: promo

      - type: custom:mushroom-media-player-card
        entity: media_player.home_speaker
        name: Be Honest
        use_media_info: true
        show_volume_level: true
        volume_controls:
          - volume_mute
          - volume_set
        media_controls:
          - previous
          - play_pause_stop
          - next
        view_layout:
          grid-area: media

      - type: picture-entity
        entity: camera.front_door
        name: Hall
        camera_view: live
        show_state: false
        view_layout:
          grid-area: camera

      # Native thermostat card provides a real circular dial and native climate services.
      - type: thermostat
        entity: climate.living_room
        name: Room Temperature
        show_current_as_primary: true
        view_layout:
          grid-area: climate

      # Mushroom controls call light.turn_on / light.turn_off and expose brightness.
      - type: custom:mushroom-light-card
        entity: light.bedroom
        name: Bedroom Light
        icon: mdi:ceiling-light
        use_light_color: true
        show_brightness_control: true
        show_color_temp_control: true
        collapsible_controls: false
        tap_action:
          action: toggle
        view_layout:
          grid-area: light

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.air_conditioner
            name: Air Conditioner
            icon: mdi:air-conditioner
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: media_player.living_room_tv
            name: Television
            icon: mdi:television
            tap_action:
              action: more-info
          - type: custom:mushroom-light-card
            entity: light.living_room
            name: Living Room
            show_brightness_control: true
            use_light_color: true
          - type: custom:mushroom-light-card
            entity: light.smart_bulb
            name: Smart Bulb
            show_brightness_control: true
            use_light_color: true
          - type: custom:mushroom-entity-card
            entity: vacuum.robot_vacuum
            name: Smart Cleaner
            icon: mdi:robot-vacuum
            tap_action:
              action: more-info
        view_layout:
          grid-area: devices

      - type: custom:mini-graph-card
        name: Energy (kWh)
        entities:
          - entity: sensor.energy_consumption
            name: Consumption
        hours_to_show: 168
        points_per_hour: 0.25
        line_width: 3
        show:
          fill: fade
          labels: true
          legend: false
          extrema: true
        view_layout:
          grid-area: energy

      - type: custom:mushroom-media-player-card
        entity: media_player.home_speaker
        name: HomePod Mini
        use_media_info: true
        show_volume_level: false
        media_controls:
          - play_pause_stop
        view_layout:
          grid-area: speaker

      - type: weather-forecast
        entity: weather.home
        name: Weather
        forecast_type: daily
        view_layout:
          grid-area: weather
