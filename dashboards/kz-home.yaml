title: KZ Home
views:
  - title: My Home
    path: home
    icon: mdi:home
    type: custom:grid-layout
    theme: Apple Glass
    background: center / cover no-repeat fixed url("/local/kz-ha-dashboard/background.jpg")
    layout:
      grid-template-columns: repeat(12, minmax(0, 1fr))
      grid-template-rows: auto
      grid-gap: 14px
      padding: 24px
      mediaquery:
        "(max-width: 1100px)":
          grid-template-columns: repeat(6, minmax(0, 1fr))
          grid-gap: 12px
          padding: 16px
        "(max-width: 700px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
          grid-gap: 10px
          padding: 10px
    cards:
      - type: custom:mushroom-title-card
        title: "Welcome home"
        subtitle: "Your home at a glance"
        view_layout:
          grid-column: 1 / -1

      - type: custom:mushroom-chips-card
        alignment: start
        chips:
          - type: navigation
            navigation_path: /kz-home/home
            icon: mdi:home
            content_info: name
            name: My Home
          - type: navigation
            navigation_path: /kz-home/living-room
            icon: mdi:sofa
            content_info: name
            name: Living Room
          - type: navigation
            navigation_path: /kz-home/bedroom
            icon: mdi:bed
            content_info: name
            name: Bedroom
          - type: navigation
            navigation_path: /kz-home/bathroom
            icon: mdi:shower
            content_info: name
            name: Bathroom
          - type: navigation
            navigation_path: /kz-home/office
            icon: mdi:desk
            content_info: name
            name: Office
        view_layout:
          grid-column: 1 / -1

      - type: custom:mushroom-template-card
        primary: Room temperature
        secondary: "{{ states('sensor.living_room_temperature') }} °C"
        icon: mdi:thermometer
        entity: sensor.living_room_temperature
        tap_action:
          action: more-info
        fill_container: true
        view_layout:
          grid-column: 1 / span 4
          grid-row: span 2

      - type: custom:mushroom-climate-card
        entity: climate.living_room
        name: Climate
        show_temperature_control: true
        hvac_modes:
          - heat
          - cool
          - auto
          - "off"
        collapsible_controls: false
        view_layout:
          grid-column: 5 / span 4
          grid-row: span 2

      - type: custom:mushroom-light-card
        entity: light.bedroom
        name: Bedroom light
        show_brightness_control: true
        show_color_temp_control: true
        use_light_color: true
        collapsible_controls: false
        view_layout:
          grid-column: 9 / span 4
          grid-row: span 2

      - type: custom:mushroom-light-card
        entity: light.living_room
        name: Living room
        show_brightness_control: true
        use_light_color: true
        view_layout:
          grid-column: 1 / span 3

      - type: custom:mushroom-entity-card
        entity: switch.air_conditioner
        name: Air conditioner
        icon: mdi:air-conditioner
        tap_action:
          action: toggle
        view_layout:
          grid-column: 4 / span 3

      - type: custom:mushroom-entity-card
        entity: media_player.living_room_tv
        name: Television
        icon: mdi:television
        tap_action:
          action: more-info
        view_layout:
          grid-column: 7 / span 3

      - type: custom:mushroom-entity-card
        entity: vacuum.robot_vacuum
        name: Smart cleaner
        icon: mdi:robot-vacuum
        tap_action:
          action: more-info
        view_layout:
          grid-column: 10 / span 3

      - type: custom:mini-graph-card
        name: Energy (kWh)
        entities:
          - entity: sensor.energy_consumption
            name: Consumption
        hours_to_show: 168
        points_per_hour: 0.25
        line_width: 3
        show:
          fill: fade
          labels: true
          legend: false
          extrema: true
        view_layout:
          grid-column: 1 / span 6

      - type: custom:mushroom-media-player-card
        entity: media_player.home_speaker
        name: Home speaker
        use_media_info: true
        show_volume_level: true
        volume_controls:
          - volume_mute
          - volume_set
        media_controls:
          - previous
          - play_pause_stop
          - next
        view_layout:
          grid-column: 7 / span 3

      - type: weather-forecast
        entity: weather.home
        name: Weather
        forecast_type: daily
        view_layout:
          grid-column: 10 / span 3

      - type: picture-entity
        entity: camera.front_door
        name: Hall
        camera_view: live
        show_state: false
        show_name: true
        view_layout:
          grid-column: 1 / span 6

      - type: custom:mushroom-alarm-control-panel-card
        entity: alarm_control_panel.home
        name: Home security
        states:
          - armed_home
          - armed_away
          - armed_night
          - disarmed
        view_layout:
          grid-column: 7 / span 6

  - title: Living Room
    path: living-room
    icon: mdi:sofa
    cards:
      - type: heading
        heading: Living Room
        heading_style: title
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-climate-card
            entity: climate.living_room
            show_temperature_control: true
          - type: custom:mushroom-light-card
            entity: light.living_room
            show_brightness_control: true
            use_light_color: true
          - type: custom:mushroom-media-player-card
            entity: media_player.living_room_tv
            use_media_info: true
          - type: picture-entity
            entity: camera.living_room
            camera_view: auto
            show_state: false

  - title: Bedroom
    path: bedroom
    icon: mdi:bed
    cards:
      - type: heading
        heading: Bedroom
        heading_style: title
      - type: custom:mushroom-light-card
        entity: light.bedroom
        show_brightness_control: true
        show_color_temp_control: true
        use_light_color: true

  - title: Bathroom
    path: bathroom
    icon: mdi:shower
    cards:
      - type: heading
        heading: Bathroom
        heading_style: title
      - type: custom:mushroom-light-card
        entity: light.bathroom
        show_brightness_control: true

  - title: Office
    path: office
    icon: mdi:desk
    cards:
      - type: heading
        heading: Office
        heading_style: title
      - type: custom:mushroom-light-card
        entity: light.office
        show_brightness_control: true
      - type: custom:mushroom-entity-card
        entity: sensor.office_temperature
        name: Temperature
