name: Validate dashboard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  yaml:
    name: Validate YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Parse dashboard, theme, and configuration YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          roots = (Path("dashboards"), Path("themes"), Path("configuration"))
          files = sorted(path for root in roots if root.exists() for path in root.rglob("*.yaml"))
          if not files:
              raise SystemExit("No YAML files found to validate.")

          failed = False
          for path in files:
              try:
                  with path.open(encoding="utf-8") as stream:
                      list(yaml.safe_load_all(stream))
                  print(f"OK  {path}")
              except (OSError, yaml.YAMLError) as error:
                  failed = True
                  print(f"ERROR  {path}: {error}")

          if failed:
              raise SystemExit(1)
          print(f"Validated {len(files)} YAML files.")
          PY
