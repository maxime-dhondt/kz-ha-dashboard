# Glass Home – native "Sections" view (everything editable in the UI), responsive.
#
# One full-width section of up to 4 columns (12 cells per column). The sidebar is a real card of that
# section (one column wide, tall) and the other cards flow to its right, one column each: 4 columns on
# wide screens, 3 / 2 / 1 as the screen gets narrower. Every card's width / height is yours to change in
# the sections editor (card → Layout) or with `grid_options` (columns = cells, rows = 56 px each).
# Below 900 px the sidebar becomes a fixed icon rail / bottom bar (second sidebar card, shown by its `visibility`).
# Same look with the exact desktop proportions of the mockup: sections-view-wide.yaml.
#
# Paste in: Edit dashboard → ⋮ → Raw configuration editor (replace the entities with yours).
title: Home
views:
  - title: Glass
    path: glass
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          # Sidebar (screens ≥ 900 px): a column of the section. Icon rail when its cell gets narrow.
          - type: custom:glass-sidebar-card
            grid_options: { columns: 12, rows: 14 }
            visibility:
              - { condition: screen, media_query: '(min-width: 900px)' }
            title: Home
            subtitle: My Smart Home
            icon: mdi:home
            status_entities: [alarm_control_panel.home, camera.front_door, climate.living_room]
            items: &nav
              - {
                  name: Overview,
                  short_name: Home,
                  icon: mdi:home,
                  navigation_path: /dashboard-glass/glass,
                  pin_mobile: true,
                }
              - { name: Lights, icon: mdi:lightbulb, navigation_path: /dashboard-glass/lights }
              - { name: Climate, icon: mdi:thermometer, navigation_path: /dashboard-glass/climate }
              - {
                  name: Security,
                  icon: mdi:shield-lock,
                  navigation_path: /dashboard-glass/security,
                  pin_mobile: true,
                }
              - { name: Energy, icon: mdi:flash, navigation_path: /dashboard-glass/energy }
              - {
                  name: Media,
                  icon: mdi:play-box,
                  navigation_path: /dashboard-glass/media,
                  pin_mobile: true,
                }
              - { name: Settings, icon: mdi:cog, navigation_path: /config, pin_mobile: true }

          - type: custom:glass-header-card
            grid_options: { columns: 24, rows: auto }
            weather_entity: weather.home

          - type: custom:glass-modes-card
            grid_options: { columns: 24, rows: auto }
            entity: input_select.house_mode
            modes:
              - { name: Home, subtitle: Home mode, icon: mdi:home, option: Home, color: blue }
              - {
                  name: Night,
                  subtitle: Night mode,
                  icon: mdi:weather-night,
                  option: Night,
                  color: blue-grey,
                }
              - {
                  name: Away,
                  subtitle: Away mode,
                  icon: mdi:airplane,
                  option: Away,
                  color: blue-grey,
                }
              - { name: Eco, subtitle: Eco mode, icon: mdi:leaf, option: Eco, color: green }

          # One column (12 cells) per card
          - type: custom:glass-climate-card
            grid_options: { columns: 12, rows: 5 }
            entity: climate.living_room
          - type: custom:glass-lights-card
            grid_options: { columns: 12, rows: 5 }
            rooms:
              - { name: Living Room, icon: mdi:sofa, entities: [light.living_room_main] }
              - { name: Kitchen, icon: mdi:silverware-fork-knife, entities: [light.kitchen] }
          - type: custom:glass-camera-card
            grid_options: { columns: 12, rows: 5 }
            entity: camera.front_door
            name: Front Door

          - type: custom:glass-security-card
            grid_options: { columns: 12, rows: 5 }
            entity: alarm_control_panel.home
            door_entities: [lock.front_door, cover.garage_door]
          - type: custom:glass-energy-card
            grid_options: { columns: 12, rows: 5 }
            entity: sensor.house_power
          - type: custom:glass-media-card
            grid_options: { columns: 12, rows: 5 }
            entity: media_player.living_room
          - type: custom:glass-quick-info-card
            grid_options: { columns: 12, rows: 5 }
            items:
              - { type: calendar, entity: calendar.work, name: Next event }
              - { entity: cover.garage_door, name: Garage }

          # Same sidebar on smaller screens: icon rail on tablets, bottom bar on phones (its cell stays empty).
          - type: custom:glass-sidebar-card
            position: fixed
            grid_options: { columns: 12, rows: 1 }
            visibility:
              - { condition: screen, media_query: '(max-width: 899px)' }
            items: *nav

          # Invisible: the picture behind everything (/local/..., https://... or a media source such as
          # media-source://image_upload/<id>; for /local/ copy examples/house.jpg to /config/www/glass-home/).
          - type: custom:glass-background-card
            grid_options: { columns: 12, rows: 1 }
            background: /local/glass-home/house.jpg
